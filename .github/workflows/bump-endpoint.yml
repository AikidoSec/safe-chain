name: Bump Device Protection Automatically

on:
  schedule:
    - cron: '0 * * * *' # every hour
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-endpoint:
    runs-on: open-source-releaser
    steps:
      - uses: actions/checkout@v4

      - name: Get latest safechain-internals release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh api repos/AikidoSec/safechain-internals/releases/latest --jq '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get current version from install script
        id: current
        run: |
          CURRENT=$(grep -oP '(?<=releases/download/)[^/]+(?=/EndpointProtection\.pkg)' install-scripts/install-endpoint-mac.sh)
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Download assets and compute checksums
        if: steps.latest.outputs.version != steps.current.outputs.version
        id: checksums
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          BASE="https://github.com/AikidoSec/safechain-internals/releases/download/${VERSION}"
          curl -fsSL "${BASE}/EndpointProtection.pkg" -o /tmp/EndpointProtection.pkg
          curl -fsSL "${BASE}/EndpointProtection.msi" -o /tmp/EndpointProtection.msi
          echo "mac=$(sha256sum /tmp/EndpointProtection.pkg | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "win=$(sha256sum /tmp/EndpointProtection.msi | cut -d' ' -f1)" >> $GITHUB_OUTPUT

          for entry in \
            "linux_amd64_deb:EndpointProtection-amd64.deb" \
            "linux_arm64_deb:EndpointProtection-arm64.deb" \
            "linux_amd64_el9_rpm:EndpointProtection-amd64.el9.rpm" \
            "linux_arm64_el9_rpm:EndpointProtection-arm64.el9.rpm" \
            "linux_amd64_el10_rpm:EndpointProtection-amd64.el10.rpm" \
            "linux_arm64_el10_rpm:EndpointProtection-arm64.el10.rpm"; do
            KEY="${entry%%:*}"
            ASSET="${entry#*:}"
            curl -fsSL "${BASE}/${ASSET}" -o "/tmp/${ASSET}"
            echo "${KEY}=$(sha256sum "/tmp/${ASSET}" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          done

      - name: Update install scripts
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          NEW="${{ steps.latest.outputs.version }}"
          OLD="${{ steps.current.outputs.version }}"
          MAC_SHA="${{ steps.checksums.outputs.mac }}"
          WIN_SHA="${{ steps.checksums.outputs.win }}"

          sed -i "s|${OLD}/EndpointProtection.pkg|${NEW}/EndpointProtection.pkg|" install-scripts/install-endpoint-mac.sh
          sed -i "s|^DOWNLOAD_SHA256=\"[^\"]*\"|DOWNLOAD_SHA256=\"${MAC_SHA}\"|" install-scripts/install-endpoint-mac.sh

          sed -i "s|${OLD}/EndpointProtection.msi|${NEW}/EndpointProtection.msi|" install-scripts/install-endpoint-windows.ps1
          sed -i 's|^\$DownloadSha256 = "[^"]*"|\$DownloadSha256 = "'"${WIN_SHA}"'"|' install-scripts/install-endpoint-windows.ps1

          sed -i "s|releases/download/${OLD}|releases/download/${NEW}|" install-scripts/install-endpoint-linux.sh
          sed -i "s|^SHA256_AMD64_DEB=\"[^\"]*\"|SHA256_AMD64_DEB=\"${{ steps.checksums.outputs.linux_amd64_deb }}\"|" install-scripts/install-endpoint-linux.sh
          sed -i "s|^SHA256_ARM64_DEB=\"[^\"]*\"|SHA256_ARM64_DEB=\"${{ steps.checksums.outputs.linux_arm64_deb }}\"|" install-scripts/install-endpoint-linux.sh
          sed -i "s|^SHA256_AMD64_EL9_RPM=\"[^\"]*\"|SHA256_AMD64_EL9_RPM=\"${{ steps.checksums.outputs.linux_amd64_el9_rpm }}\"|" install-scripts/install-endpoint-linux.sh
          sed -i "s|^SHA256_ARM64_EL9_RPM=\"[^\"]*\"|SHA256_ARM64_EL9_RPM=\"${{ steps.checksums.outputs.linux_arm64_el9_rpm }}\"|" install-scripts/install-endpoint-linux.sh
          sed -i "s|^SHA256_AMD64_EL10_RPM=\"[^\"]*\"|SHA256_AMD64_EL10_RPM=\"${{ steps.checksums.outputs.linux_amd64_el10_rpm }}\"|" install-scripts/install-endpoint-linux.sh
          sed -i "s|^SHA256_ARM64_EL10_RPM=\"[^\"]*\"|SHA256_ARM64_EL10_RPM=\"${{ steps.checksums.outputs.linux_arm64_el10_rpm }}\"|" install-scripts/install-endpoint-linux.sh

      - name: Open PR
        if: steps.latest.outputs.version != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          NEW="${{ steps.latest.outputs.version }}"
          OLD="${{ steps.current.outputs.version }}"
          BRANCH="bump/endpoint-${NEW}"

          if git ls-remote --exit-code --heads origin "$BRANCH" &>/dev/null; then
            echo "Branch $BRANCH already exists, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add install-scripts/install-endpoint-mac.sh install-scripts/install-endpoint-windows.ps1 install-scripts/install-endpoint-linux.sh
          git commit -m "Bump Endpoint to ${NEW}"
          git push origin "$BRANCH"
          PR_URL="https://github.com/${{ github.repository }}/compare/main...${BRANCH}?expand=1"

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"update to ${NEW} - ${PR_URL}\"}"
